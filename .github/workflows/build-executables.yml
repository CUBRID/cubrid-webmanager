name: Build Executables

on:
  push:
    branches: [develop]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for'
        required: true
        type: choice
        options:
          - windows
          - linux
          - all

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' || (github.event_name == 'push' && !github.event.inputs.platform)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npx nx build api-server

      - name: Build Windows executable
        run: npx nx build:exe api-server --configuration=windows

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: api-server-windows
          path: dist/executables/api-server.exe
          retention-days: 30

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' || (github.event_name == 'push' && !github.event.inputs.platform)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npx nx build api-server

      - name: Build Linux executable
        run: npx nx build:exe api-server --configuration=linux

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: api-server-linux
          path: dist/executables/api-server-linux
          retention-days: 30
